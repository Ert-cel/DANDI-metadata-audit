[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dandi-metadata-audit"
version = "2.0.0"
description = "NWB-only evidence review engine for DANDI datasets."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Celine Ertekin"}]
dependencies = [
  "dandi>=0.68",
  "pynwb>=3.0",
  "remfile>=0.1.13",
  "h5py>=3.10",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dandi-metadata-audit = "metadata_audit.cli:main"

[tool.setuptools.packages.find]
include = ["metadata_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
metadata_audit = ["field_catalog.json"]
